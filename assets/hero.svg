<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="V2exAPI —— V2ex API 的 Swift 封装">
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB07C"/>
      <stop offset="1" stop-color="#F05138"/>
    </linearGradient>
    <radialGradient id="glowWarm">
      <stop offset="0" stop-color="#F05138" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#F05138" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCool">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#1E2530"/>
    </pattern>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B22"/>
      <stop offset="1" stop-color="#10151C"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F05138" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#F05138" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#F05138" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="#0D1117"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <circle cx="60" cy="40" r="380" fill="url(#glowWarm)"/>
  <circle cx="1180" cy="380" r="330" fill="url(#glowCool)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" fill="none" stroke="#21262D"/>

  <text x="72" y="92" font-family="-apple-system, 'Helvetica Neue', 'PingFang SC', sans-serif" font-size="14" font-weight="700" letter-spacing="5" fill="#F0836A">SWIFT PACKAGE · V2EX</text>

  <text x="72" y="168" font-family="-apple-system, 'Helvetica Neue', 'PingFang SC', sans-serif" font-size="72" font-weight="800" letter-spacing="-1" fill="url(#title)">V2exAPI</text>

  <text x="72" y="212" font-family="-apple-system, 'Helvetica Neue', 'PingFang SC', sans-serif" font-size="24" font-weight="500" fill="#C9D1D9">V2ex API 的 Swift 封装，开箱即用</text>

  <g font-family="-apple-system, 'Helvetica Neue', 'PingFang SC', sans-serif" font-size="15" fill="#ADBAC7">
    <g>
      <rect x="72" y="244" width="126" height="34" rx="17" fill="#161B22" stroke="#2B333F"/>
      <circle cx="92" cy="261" r="3.5" fill="#F05138"/>
      <text x="104" y="266">async/await</text>
    </g>
    <g>
      <rect x="210" y="244" width="158" height="34" rx="17" fill="#161B22" stroke="#2B333F"/>
      <circle cx="230" cy="261" r="3.5" fill="#F05138"/>
      <text x="242" y="266">V1 / V2 全覆盖</text>
    </g>
    <g>
      <rect x="380" y="244" width="126" height="34" rx="17" fill="#161B22" stroke="#2B333F"/>
      <circle cx="400" cy="261" r="3.5" fill="#F05138"/>
      <text x="412" y="266">零三方依赖</text>
    </g>
    <g>
      <rect x="518" y="244" width="120" height="34" rx="17" fill="#161B22" stroke="#2B333F"/>
      <circle cx="538" cy="261" r="3.5" fill="#F05138"/>
      <text x="550" y="266">自动重试</text>
    </g>
  </g>

  <rect x="72" y="330" width="560" height="2" fill="url(#rule)"/>
  <text x="72" y="366" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#6E7681">iOS 15+ · macOS 12+ · tvOS 15+ · watchOS 9+ · Linux</text>

  <g>
    <rect x="712" y="62" width="500" height="276" rx="14" fill="url(#card)" stroke="#2B333F"/>
    <rect x="712" y="62" width="500" height="38" rx="14" fill="#12171E"/>
    <rect x="712" y="88" width="500" height="12" fill="#12171E"/>
    <path d="M712 100 H1212" stroke="#2B333F"/>
    <circle cx="736" cy="81" r="5" fill="#F05138"/>
    <circle cx="754" cy="81" r="5" fill="#D4A72C"/>
    <circle cx="772" cy="81" r="5" fill="#3FB950"/>
    <text x="1188" y="86" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#6E7681">main.swift</text>

    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16">
      <text x="740" y="152"><tspan fill="#FF7B72">import</tspan><tspan fill="#E6EDF3"> V2exAPI</tspan></text>
      <text x="740" y="190"><tspan fill="#FF7B72">let</tspan><tspan fill="#E6EDF3"> v2ex = </tspan><tspan fill="#A5D6FF">V2exAPI</tspan><tspan fill="#E6EDF3">(accessToken: </tspan><tspan fill="#A5D6FF">"v2_..."</tspan><tspan fill="#E6EDF3">)</tspan></text>
      <text x="740" y="224"><tspan fill="#FF7B72">let</tspan><tspan fill="#E6EDF3"> hot = </tspan><tspan fill="#FF7B72">try</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#FF7B72">await</tspan><tspan fill="#E6EDF3"> v2ex.</tspan><tspan fill="#D2A8FF">hotTopics</tspan><tspan fill="#E6EDF3">()</tspan></text>
      <text x="740" y="258"><tspan fill="#FF7B72">for</tspan><tspan fill="#E6EDF3"> topic </tspan><tspan fill="#FF7B72">in</tspan><tspan fill="#E6EDF3"> hot {</tspan></text>
      <text x="764" y="288"><tspan fill="#D2A8FF">print</tspan><tspan fill="#E6EDF3">(topic.title, topic.</tspan><tspan fill="#79C0FF">replies</tspan><tspan fill="#E6EDF3">)</tspan></text>
      <text x="740" y="318"><tspan fill="#E6EDF3">}</tspan></text>
    </g>
  </g>
</svg>
